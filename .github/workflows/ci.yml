name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Unit and integration tests
        run: python -m pytest -q
      - name: Core portability gate
        run: python scripts/check_core_portability.py
      - name: Public surface neutrality gate
        run: python -m scripts.check_public_surface_neutrality
      - name: Offline AI evaluation contract
        run: python -m creator_hub.portfolio.ai_eval
      - name: Ruff
        run: ruff check creator_hub/api creator_hub/portfolio creator_hub/compat creator_hub/jobs.py creator_hub/monitoring.py creator_hub/field_registry.py creator_hub/ai/workspace_tools.py tests scripts/check_core_portability.py scripts/check_public_surface_neutrality.py scripts/neutralize_public_surface.py scripts/neutralize_discovery_surface.py scripts/query_pack_editor.py scripts/repo_hygiene.py
